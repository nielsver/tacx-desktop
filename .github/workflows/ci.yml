name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install BlueZ / D-Bus build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test

  linux-packaging:
    name: Linux packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop-file-utils + shellcheck + dpkg
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck dpkg-dev file curl
      - name: shellcheck
        run: |
          shellcheck packaging/linux/install.sh packaging/linux/uninstall.sh             scripts/test_linux_install.sh scripts/test_linux_packaging.sh             scripts/package_linux_appimage.sh scripts/package_linux_deb.sh
      - name: install/uninstall in a temp XDG_DATA_HOME
        run: ./scripts/test_linux_install.sh
      - name: AppImage AppDir + .deb smoke (fake bundle)
        run: ./scripts/test_linux_packaging.sh
      - name: Validate Inno Setup script syntax (headers only)
        run: |
          test -f packaging/windows/tacx-desktop.iss
          test -f packaging/windows/windows-first-run.txt
          test -f scripts/package_windows_installer.ps1
          grep -q 'AppName=' packaging/windows/tacx-desktop.iss
          grep -q 'tacx_desktop.exe' packaging/windows/tacx-desktop.iss

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BlueZ / D-Bus build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust cdylib (for widget tests)
        run: cargo build
        working-directory: rust
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: |
          export LD_LIBRARY_PATH="$PWD/rust/target/debug:${LD_LIBRARY_PATH:-}"
          flutter test
