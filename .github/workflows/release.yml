name: Release

# Builds ready-to-run desktop packages for Windows, Linux and macOS.
# Run manually from the Actions tab (artifacts only), or push a tag like
# v0.1.0 to also publish a GitHub Release with all packages attached
# (single `publish` job at the end).
#
# Linux (Garuda first): tar.gz + AppImage + .deb
# Windows: zip + Inno Setup installer (Setup.exe)
# macOS: zipped .app (ad-hoc signed, not notarized)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust tests
        working-directory: rust
        run: cargo test
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build windows --release
        run: flutter build windows --release
      - name: Zip Release folder
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "tacx-desktop-windows-x64-$ver.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zip
          "PKG=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem build\windows\x64\runner\Release
      - name: Install Inno Setup
        timeout-minutes: 10
        run: choco install innosetup --no-progress -y
      - name: Build Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          ./scripts/package_windows_installer.ps1 -Version $env:VER
          $setup = Get-ChildItem dist\TacxDesktop-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe missing" }
          "INSTALLER=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item $setup.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: tacx-desktop-windows-x64
          path: |
            ${{ env.PKG }}
            ${{ env.INSTALLER }}
          retention-days: 30

  linux:
    name: Linux x64 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Linux + BlueZ / D-Bus + packaging deps
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang cmake ninja-build pkg-config
            libgtk-3-dev liblzma-dev libdbus-1-dev
            dpkg-dev fakeroot file curl desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust tests
        working-directory: rust
        run: cargo test
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build linux --release
        run: flutter build linux --release
      - name: Check Rust cdylib is bundled
        run: |
          ls -la build/linux/x64/release/bundle build/linux/x64/release/bundle/lib
          ls build/linux/x64/release/bundle/lib | grep -q tacx_desktop_core \
            || { echo "::error::Rust cdylib missing from Linux bundle"; exit 1; }
      - name: Stage launcher files into bundle
        run: |
          cp packaging/linux/FIRST_RUN.txt packaging/linux/install.sh packaging/linux/uninstall.sh \
             packaging/linux/com.nielsver.tacx_desktop.png build/linux/x64/release/bundle/
          chmod +x build/linux/x64/release/bundle/install.sh \
                   build/linux/x64/release/bundle/uninstall.sh \
                   build/linux/x64/release/bundle/tacx_desktop
      - name: Version stamp
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="main-${GITHUB_SHA::7}"; fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          # deb-friendly version (strip leading v)
          echo "DEB_VER=${ver#v}" >> "$GITHUB_ENV"
      - name: Tarball bundle
        run: |
          pkg="tacx-desktop-linux-x64-$VER.tar.gz"
          tar -C build/linux/x64/release -czf "$pkg" --transform 's,^bundle,tacx-desktop,' bundle
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          tar -tzf "$pkg" | head -30
          for f in FIRST_RUN.txt install.sh uninstall.sh com.nielsver.tacx_desktop.png; do
            tar -tzf "$pkg" | grep -q "tacx-desktop/$f" \
              || { echo "::error::$f missing from Linux tarball"; exit 1; }
          done
      - name: Build AppImage
        run: |
          ./scripts/package_linux_appimage.sh build/linux/x64/release/bundle "$VER" .
          appimage=$(ls Tacx_Desktop-*-x86_64.AppImage | head -1)
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"
          file "$appimage"
      - name: Build .deb
        run: |
          ./scripts/package_linux_deb.sh build/linux/x64/release/bundle "$DEB_VER" .
          deb=$(ls tacx-desktop_*_amd64.deb | head -1)
          echo "DEB=$deb" >> "$GITHUB_ENV"
          dpkg-deb -I "$deb" | head -25
      - uses: actions/upload-artifact@v4
        with:
          name: tacx-desktop-linux-x64
          path: |
            ${{ env.PKG }}
            ${{ env.APPIMAGE }}
            ${{ env.DEB }}
          retention-days: 30

  macos:
    name: macOS release (ad-hoc signed, not notarized)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust tests
        working-directory: rust
        run: cargo test
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build macos --release
        run: flutter build macos --release
      - name: Verify entitlements + zip .app
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "App: $app"
          codesign -d --entitlements - "$app" 2>&1 | tee entitlements.txt
          grep -q "com.apple.security.device.bluetooth" entitlements.txt \
            || { echo "::error::Bluetooth entitlement missing from release .app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$app/Contents/Info.plist"
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="main-${GITHUB_SHA::7}"; fi
          pkg="tacx-desktop-macos-$ver.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          ls -la "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: tacx-desktop-macos
          path: ${{ env.PKG }}
          retention-days: 30

  # One job creates/updates the GitHub Release after the builds finish, so the
  # parallel build jobs never race to create the same release. Windows + Linux
  # are required; the macOS zip is attached when that job succeeded.
  publish:
    name: Publish GitHub Release (tags only)
    needs: [windows, linux, macos]
    if: >-
      always() && github.ref_type == 'tag' &&
      needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv -t release/ {} +
          ls -la release
          for pat in '*.AppImage' '*_amd64.deb' 'tacx-desktop-linux-x64-*.tar.gz' 'TacxDesktop-Setup-*.exe'; do
            compgen -G "release/$pat" >/dev/null \
              || { echo "::error::release asset $pat missing"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
