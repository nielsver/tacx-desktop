name: Windows release

# Builds a ready-to-run Windows zip (exe + DLLs + Rust cdylib + data).
# Run manually from the Actions tab, or push a tag like v0.1.0 to also
# attach the zip to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust tests
        working-directory: rust
        run: cargo test
      - name: flutter pub get
        run: flutter pub get
      - name: flutter build windows --release
        run: flutter build windows --release
      - name: Zip Release folder
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "tacx-desktop-windows-x64-$ver.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem build\windows\x64\runner\Release
      - uses: actions/upload-artifact@v4
        with:
          name: tacx-desktop-windows-x64
          path: ${{ env.ZIP }}
          retention-days: 30
      - name: Attach to GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
